name: AWS OIDC identity check

on:
  workflow_dispatch:

permissions: {}

jobs:
  caller-identity:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-identity-check
          role-duration-seconds: 900

      - name: Print assumed-role identity
        run: aws sts get-caller-identity --query Arn --output text

