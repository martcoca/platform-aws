name: AWS OIDC identity check

on:
  workflow_dispatch:

permissions: {}

jobs:
  caller-identity:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Diagnostic: print only the decoded claims, never the token itself. sub/aud/ref
      # name the repository and branch and carry no account id or secret material.
      - name: Show the OIDC subject this run presents
        run: |
          tok="$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          printf '%s' "$tok" | cut -d. -f2 \
            | { read -r p; printf '%s' "$p==="; } | base64 -d 2>/dev/null \
            | jq -r '{sub, aud, repository, ref, event_name, workflow_ref}'

      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-identity-check
          role-duration-seconds: 900

      # This repository is public, so its workflow logs are public. Assert the identity
      # instead of printing it: a raw caller-identity ARN would publish the account id,
      # which doctrine treats as never-publish.
      - name: Verify the federated identity
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "$arn" in
            *":assumed-role/github-actions-platform-aws-plan/"*)
              echo "OK: federated as the expected role, with no stored credential" ;;
            *)
              echo "FAIL: unexpected identity"; exit 1 ;;
          esac

