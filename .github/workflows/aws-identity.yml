name: AWS OIDC identity check

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  caller-identity:
    runs-on: ubuntu-latest
    # A job with no cap can burn to GitHub's 6-hour default. One did: 4h19m.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Obtain short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.2
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
          role-session-name: github-actions-identity-check
          role-duration-seconds: 900

      # This repository is public, so its workflow logs are public. Assert the identity
      # instead of printing it: a raw caller-identity ARN would publish the account id,
      # which doctrine treats as never-publish.
      - name: Verify the federated identity
        run: |
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          case "$arn" in
            *":assumed-role/github-actions-platform-aws-plan/"*)
              echo "OK: federated as the expected role, with no stored credential" ;;
            *)
              echo "FAIL: unexpected identity"; exit 1 ;;
          esac
