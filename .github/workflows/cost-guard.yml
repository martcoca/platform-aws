name: Cost guard

# This repository holds no guard and no denylist. Both travel with the pinned composite
# action, so what is asserted here is the *consumption*: that the released action still
# gates this repository's plans the way the deleted local copy did — same six inputs, same
# three exit outcomes — now through `uses:` rather than through `bash scripts/...`.

on:
  pull_request:
  push:
  # Required: an auto-merge push raises no events, so this must be dispatchable.
  workflow_dispatch:
# Least privilege, declared: the organization default is now write, and a workflow
# that declares nothing inherits it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  action-contract:
    name: The released action gates this repository's plans
    runs-on: ubuntu-latest
    # The five failing steps carry continue-on-error so this job can assert that they
    # failed. A job that actually goes red cannot exist in a repository whose merge gate
    # requires every check green, and `outcome == failure` is the same fact recorded
    # rather than acted on. The real gate is aws-plan.yml, where the guard step has no
    # such excuse and check-ci-contract.sh forbids one there.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: An empty plan file is not a clean plan
        shell: bash
        run: ': > "$RUNNER_TEMP/empty-plan.json"'

      - name: A clean plan is allowed
        id: clean
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-clean.json

      - name: A denied create fails the step
        id: denied
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-with-nat.json

      # Cloud NAT entered the shared denylist in cost-guard v1.0.1. This step is the
      # propagation test: it passes only if the pinned release actually carries that
      # denial. Pinned to a release that predates it, the plan is allowed and this job
      # goes red. The type is GCP's, and it is asserted here on purpose — this repository
      # consumes the whole portfolio denylist, not an AWS slice of it, and a denial that
      # arrives for one cloud arrives for all three or the release is not shared.
      - name: A denied Cloud NAT create fails the step
        id: cloud-nat
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-with-cloud-nat.json

      - name: A denied create in event-stream form fails the step
        id: denied-events
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-events-with-nat.jsonl

      - name: An errored plan fails closed
        id: errored
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-errored.jsonl

      - name: Unrecognizable input fails closed
        id: unrecognizable
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-unrecognizable.txt

      - name: An empty plan fails closed
        id: empty
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: ${{ runner.temp }}/empty-plan.json

      - name: Assert every outcome, including that undecidable is no softer than denied
        shell: bash
        env:
          CLEAN: ${{ steps.clean.outcome }}/${{ steps.clean.outputs.verdict }}/${{ steps.clean.outputs.exit-code }}
          DENIED: ${{ steps.denied.outcome }}/${{ steps.denied.outputs.verdict }}/${{ steps.denied.outputs.exit-code }}
          CLOUD_NAT: ${{ steps.cloud-nat.outcome }}/${{ steps.cloud-nat.outputs.verdict }}/${{ steps.cloud-nat.outputs.exit-code }}
          DENIED_EVENTS: ${{ steps.denied-events.outcome }}/${{ steps.denied-events.outputs.verdict }}/${{ steps.denied-events.outputs.exit-code }}
          ERRORED: ${{ steps.errored.outcome }}/${{ steps.errored.outputs.verdict }}/${{ steps.errored.outputs.exit-code }}
          UNRECOGNIZABLE: ${{ steps.unrecognizable.outcome }}/${{ steps.unrecognizable.outputs.verdict }}/${{ steps.unrecognizable.outputs.exit-code }}
          EMPTY: ${{ steps.empty.outcome }}/${{ steps.empty.outputs.verdict }}/${{ steps.empty.outputs.exit-code }}
        run: |
          set -euo pipefail
          failed=0
          assert() {
            local label=$1 want=$2 got=$3
            if [[ "$got" != "$want" ]]; then
              printf '%s: expected %s, got %s\n' "$label" "$want" "$got" >&2
              failed=1
            else
              printf '%s: %s\n' "$label" "$got"
            fi
          }
          assert 'clean plan'          'success/allow/0'       "$CLEAN"
          assert 'denied create'       'failure/deny/1'        "$DENIED"
          assert 'denied Cloud NAT'    'failure/deny/1'        "$CLOUD_NAT"
          assert 'denied create (events)' 'failure/deny/1'     "$DENIED_EVENTS"
          assert 'errored plan'        'failure/undecidable/2' "$ERRORED"
          assert 'unrecognizable'      'failure/undecidable/2' "$UNRECOGNIZABLE"
          assert 'empty plan'          'failure/undecidable/2' "$EMPTY"
          [[ "$failed" -eq 0 ]] || {
            printf '\nThe released action no longer gates this repository as required.\n' >&2
            exit 1
          }

  freshness-cannot-touch-the-verdict:
    name: A broken freshness lookup changes no verdict
    runs-on: ubuntu-latest
    # Job-level, so the composite action's own steps inherit it: every `gh api` call the
    # freshness action makes goes to a host that does not resolve. That is the network
    # failure this job exists to survive, and it is the whole reason freshness is a
    # separate action from the guard rather than another thing the guard does.
    env:
      GH_HOST: cost-guard-freshness.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the cost-guard pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          printf 'pin=%s\n' "$(tr -d '[:space:]' < config/cost-guard-action.txt)" >>"$GITHUB_OUTPUT"

      - name: A clean plan is still allowed while the lookup is broken
        id: clean
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-clean.json

      - name: A denied create still fails while the lookup is broken
        id: denied
        continue-on-error: true
        uses: martcoca/cost-guard@v1.0.2
        with:
          plan: tests/fixtures/plan-with-nat.json

      # fail-on-stale is true here to prove it is not the thing that matters: an unknown
      # verdict does not fail the step whatever this is set to. Failing because a lookup
      # did not happen would put a network dependency in front of work that needs none.
      - name: Freshness reports unknown, never current
        id: freshness
        uses: martcoca/cost-guard/freshness@v1.0.2
        with:
          pin: ${{ steps.pin.outputs.pin }}
          fail-on-stale: 'true'

      - name: Assert the verdicts stand and freshness is unknown
        shell: bash
        env:
          CLEAN: ${{ steps.clean.outcome }}/${{ steps.clean.outputs.verdict }}/${{ steps.clean.outputs.exit-code }}
          DENIED: ${{ steps.denied.outcome }}/${{ steps.denied.outputs.verdict }}/${{ steps.denied.outputs.exit-code }}
          FRESHNESS: ${{ steps.freshness.outcome }}/${{ steps.freshness.outputs.status }}
          LATEST: ${{ steps.freshness.outputs.latest-release }}
        run: |
          set -euo pipefail
          failed=0
          assert() {
            local label=$1 want=$2 got=$3
            if [[ "$got" != "$want" ]]; then
              printf '%s: expected %s, got %s\n' "$label" "$want" "$got" >&2
              failed=1
            else
              printf '%s: %s\n' "$label" "$got"
            fi
          }
          assert 'clean plan, lookup broken'    'success/allow/0'   "$CLEAN"
          assert 'denied create, lookup broken' 'failure/deny/1'    "$DENIED"
          assert 'freshness, no reachable API'  'success/unknown'   "$FRESHNESS"
          # "could not ask" must not be dressed up as an answer.
          if [[ -n "$LATEST" ]]; then
            printf 'freshness named a current release (%s) with no reachable API\n' "$LATEST" >&2
            failed=1
          fi
          [[ "$failed" -eq 0 ]] || {
            printf '\nA broken freshness lookup changed a verdict, or claimed knowledge it did not have.\n' >&2
            exit 1
          }
